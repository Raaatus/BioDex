name = "biodex-sondage"
main = "worker.js"
compatibility_date = "2025-01-01"

# L'espace KV qui garde le total et les empreintes d'adresses.
# `wrangler kv namespace create VOTES` donne l'identifiant à coller ici.
[[kv_namespaces]]
binding = "VOTES"
id = "A_REMPLACER"

[vars]
# L'adresse du site, et rien d'autre, peut appeler ce worker.
ORIGINE = "https://raaatus.github.io"
