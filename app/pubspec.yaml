name: biodex
description: "A new Flutter project."
publish_to: 'none'
version: 0.9.1+13

environment:
  sdk: ^3.13.0

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_map_marker_cluster: ^8.2.2
  flutter_svg: ^2.3.0
  gal: ^2.3.3
  geolocator: ^14.0.3
  http: ^1.6.0
  image_picker: ^1.2.3
  latlong2: ^0.9.1
  # L’éditeur d’image des photos non identifiées : recadrage, rotation,
  # contraste, dessin. BSD-3, sans dépendance native.
  model_viewer_plus: ^1.10.0
  pro_image_editor: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # L'animation d'attente. Embarquée dans l'APK plutôt que servie par le
    # serveur : elle s'affiche précisément quand le réseau se fait attendre.
    - assets/animations/chargement.webp
    # Les modèles de la vitrine. Embarqués eux aussi : un rang qui ne
    # s'affiche qu'avec du réseau ne serait pas un rang.
    - assets/modeles/
    # Les dictionnaires de traduction, générés depuis i18n/ à la racine.
    - assets/lang/

  # Le cristal des succès. Compilé par Flutter au build : les fissures et la
  # lumière qui s'en échappe se calculent par pixel sur le GPU, ce qu'aucune
  # suite d'images ne saurait faire suivre la forme.
  shaders:
    - assets/shaders/cristal.frag
